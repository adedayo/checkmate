name: Spec Lint

on:
  push:
    paths:
      - "openspec/**"
  pull_request:
    paths:
      - "openspec/**"

jobs:
  lint-openapi:
    name: Lint OpenAPI Spec
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec
        run: |
          spectral lint \
            openspec/changes/001-clean-slate-platform/specs/api-contract/openapi.yaml \
            --fail-severity error
