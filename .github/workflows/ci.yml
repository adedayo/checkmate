name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  lint-openapi:
    name: Spectral Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Spectral API Linter
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'openspec/changes/001-clean-slate-platform/specs/api-contract/openapi.yaml'
          spectral_ruleset: '.spectral.yaml'
