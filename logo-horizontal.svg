<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradH3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="checkGradH3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="textGradH3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Transparent background canvas -->

  <!-- Pure Shield + Checkmark Icon Mark (Scaled & Offset) -->
  <g transform="translate(10, 5) scale(0.31)">
    <!-- Minimal Shield Contour -->
    <path d="M256 48 L404 104 V232 C404 348 334 428 256 460 C178 428 108 348 108 232 V104 L256 48 Z" 
          fill="none" 
          stroke="url(#shieldGradH3)" 
          stroke-width="26" 
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Centered Bold Emerald Checkmark -->
    <path d="M176 252 L236 312 L348 192" 
          fill="none" 
          stroke="url(#checkGradH3)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="180" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#0F172A">Check</tspan>
    <tspan fill="url(#textGradH3)">Mate</tspan>
  </text>

  <!-- Subtitle -->
  <text x="184" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#64748B" letter-spacing="3">
    HARD-CODED SECRETS DETECTION
  </text>
</svg>
